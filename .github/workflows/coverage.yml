name: coverage
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          pip install coverage
          pip install -e ".[yaml]"
      - name: Run coverage
        run: |
          coverage run -m unittest discover -s tests
          coverage report -m
