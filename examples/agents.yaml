# Agent credentials are read once at startup. OpenAI and xAI calls use a proposal schema; a 400 falls back.
# A cloud agent receives the constitution text. Use a different API key than the judges.
# Monitored agents. Several may be configured. Hosting is local or cloud.
# A cloud agent (Grok, ChatGPT, Claude, Gemini, or any other vendor) is not
# trusted: its proposal still has to pass the constitution. No secrets here.
# Replace every REPLACE_WITH_MODEL. Use a different API key than the judges.
# Declare the agent you run to TwoKey: TwoKey(monitored_agent=agent), or a
# list of agents, or the monitored_agent block in judges.yaml for the CLI.
# Each declared agent is checked against every judge at startup. A judge
# with the same key, a shared tenant id, or the same model on the same
# endpoint host:port as an agent refuses to start. Only the top-level key
# agents is accepted, and a repeated key is refused.

agents:
  - id: grok
    type: openai_compatible
    provider: xai
    hosting: cloud
    base_url: https://api.x.ai/v1
    model: REPLACE_WITH_MODEL
    auth: {type: env, var: XAI_AGENT_API_KEY}

  - id: chatgpt
    type: openai_compatible
    provider: openai
    hosting: cloud
    base_url: https://api.openai.com/v1
    model: REPLACE_WITH_MODEL
    auth: {type: env, var: OPENAI_AGENT_API_KEY}

  - id: claude
    type: anthropic
    provider: anthropic
    hosting: cloud
    model: REPLACE_WITH_MODEL
    auth: {type: env, var: ANTHROPIC_AGENT_API_KEY}

  - id: gemini
    type: gemini
    provider: google
    hosting: cloud
    model: REPLACE_WITH_MODEL
    auth: {type: env, var: GEMINI_AGENT_API_KEY}

  - id: local-llama
    type: ollama
    provider: local
    hosting: local
    base_url: http://localhost:11434
    model: REPLACE_WITH_MODEL
